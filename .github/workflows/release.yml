name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag on main (for retrying a failed release)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve version tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ['REQUESTED_TAG']
          if not re.fullmatch(r'v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?', tag):
              raise SystemExit('Expected an existing semantic version tag, for example v0.6.0.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tag=' + tag + '\n')
          PY

  build:
    name: Verify and package
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      release_tag: ${{ needs.resolve.outputs.tag }}

  publish:
    name: Publish verified downloads
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-universal
          path: downloads
      - name: Verify artifact checksums and provenance
        run: |
          cd downloads
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          data = json.loads(Path('build-info.json').read_text())
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert data['sourceCommit'] == commit, 'Artifact source differs from the tag'
          assert data['releaseVersion'] == os.environ['RELEASE_TAG'][1:]
          assert data['architectures'] == ['arm64', 'x86_64']
          assert data['signing'] == 'ad-hoc' and data['notarized'] is False
          PY
      - name: Prepare and publish release
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "A published release is never overwritten; use a new version tag."'
          else
            notes="docs/releases/${RELEASE_TAG#v}.md"
            if [[ ! -f "$notes" ]]; then notes=docs/releases/default.md; fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Audifern ${RELEASE_TAG#v}" --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" downloads/*.dmg downloads/*.zip downloads/SHA256SUMS downloads/build-info.json --clobber
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > release-assets.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          assets = {asset['name']: asset for asset in json.loads(Path('release-assets.json').read_text())['assets']}
          local = {path.name: path for path in Path('downloads').iterdir() if path.is_file()}
          assert set(assets) == set(local), 'Release asset set differs from verified downloads'
          for name, path in local.items():
              digest = assets[name].get('digest')
              assert digest == 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest(), 'Uploaded asset digest mismatch'
          PY
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
